    wine: Game Porting Toolkit.app/Contents/Resources/wine/bin/wine64
    arch: [x86_64]
    status: tested
    notes: Wine 7.7 + D3DMetal (DX11/12). Tested with Shogun Showdown. 32-bit games crash (e.g. Forager).

  - id: wine-crossover-23.7.1-1
