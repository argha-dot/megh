# Wine runtimes megh knows about. Built into the binary.
# - Add or override entries in ~/Library/Application Support/megh/runtimes.yml
#   (same format; an entry with the same id replaces the one here).
# - wine: path to the wine binary inside the extracted archive.
# - arch: exe types this runtime is auto-picked for (i386 = 32-bit, x86_64 = 64-bit).
# - status: tested | untested | broken. Auto-pick prefers tested, never picks broken.
# - Order matters: the first matching runtime wins.
