[package]
name = "megh"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Install and run Windows games on Apple Silicon Macs with Wine"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
